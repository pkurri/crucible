name: 🎬 YouTube Shorts Enhancement

on:
  # Schedule retired 2026-10-19: replaced by film-empire-fleet.yml (1 film/day).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  enhance-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: npm install

      - name: Enhance YouTube Shorts
        run: node scripts/youtube-shorts-enhancer.mjs

      - name: Commit Enhanced Videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/youtube-empire/*/topics/*/enhanced.json || true
          git diff --staged --quiet || git commit -m "chore: enhance YouTube Shorts with subscribe overlays [skip ci]"
          git pull --rebase origin main
          git push origin main
        continue-on-error: true

name: '🎬 AAK-tion Film Fleet (YouTube + Instagram)'

# One AI short film per day, published natively to YouTube Shorts and
# Instagram Reels after the automated quality gate passes.
# Scene engine via repo variable FILM_ENGINE: 'free' (default, $0: Cloudflare
# Workers AI free tier / Stable Horde stills + Edge TTS) or 'veo' (paid).
# GOOGLE_API_KEY only needs the Gemini free tier unless FILM_ENGINE=veo.

on:
  schedule:
    - cron: '0 14 * * *' # 14:00 UTC daily
  workflow_dispatch:
    inputs:
      no_upload:
        description: 'Produce + gate only (no publishing)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Node Dependencies
        run: npm install

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Edge TTS (free narration)
        run: pip install edge-tts

      - name: Install FFmpeg + caption font
        run:
          sudo apt-get update && sudo apt-get install -y ffmpeg
          fonts-dejavu-core

      - name: Validate Secrets
        run: |
          for s in GOOGLE_API_KEY YOUTUBE_CLIENT_SECRET YOUTUBE_TOKEN_JSON META_ACCESS_TOKEN META_IG_ACCOUNT_ID; do
            if [ -z "${!s}" ]; then echo "::error::Secret $s is missing" && exit 1; fi
          done
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_ACCOUNT_ID: ${{ secrets.META_IG_ACCOUNT_ID }}

      - name: Setup YouTube Credentials
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET }}' > client_secret.json
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > youtube-token.json

      - name: Preflight YouTube Token
        run: node scripts/youtube-official-uploader.mjs --verify

      - name: Preflight Meta Token
        run: node scripts/meta-official-uploader.mjs --verify --target insta
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_ACCOUNT_ID: ${{ secrets.META_IG_ACCOUNT_ID }}
        continue-on-error: true

      - name: Produce, Gate and Publish Film
        run:
          node scripts/film-empire-loop.mjs ${{ inputs.no_upload &&
          '--no-upload' || '' }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_ACCOUNT_ID: ${{ secrets.META_IG_ACCOUNT_ID }}
          FILM_ENGINE: ${{ vars.FILM_ENGINE || 'free' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VEO_MODEL: ${{ vars.VEO_MODEL }}
          VEO_MAX_CLIPS_PER_DAY: ${{ vars.VEO_MAX_CLIPS_PER_DAY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          GITHUB_ACTIONS: 'true'

      - name: Upload master for review (no-upload runs)
        if: always() && inputs.no_upload
        uses: actions/upload-artifact@v5
        with:
          name: film-master
          path: data/film-empire/*/final-render.mp4
          retention-days: 7

      - name: Remove Credentials
        if: always()
        run: rm -f client_secret.json youtube-token.json

      - name: Commit State
        if: always()
        run: |
          git config --global user.name "Crucible Bot"
          git config --global user.email "bot@crucible.ai"
          git add -f scripts/film-empire-state.json data/film-treatments data/viral-metadata.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: update film fleet cycle [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $i failed, retrying..."; sleep $((i * 15))
          done
          echo "::error::Failed to push state after 3 attempts" && exit 1

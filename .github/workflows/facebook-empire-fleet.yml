name: '📘 AAK Nation Facebook Empire Fleet'

on:
  schedule:
    - cron: '30 */4 * * *'  # Every 4 hours, staggered 30 mins from Instagram
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fb-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Node Dependencies
        run: npm install

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Edge TTS
        run: pip install edge-tts

      - name: Preflight Meta Token
        run: node scripts/meta-official-uploader.mjs --verify --target fb
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_FB_PAGE_ID: ${{ secrets.META_FB_PAGE_ID }}
        continue-on-error: true

      - name: Create Data Structure
        run: mkdir -p data/facebook-empire/AAK-Nation/topics

      - name: Discover Daily Viral Niche
        run: node scripts/niche-strategist.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Run Facebook Empire Loop
        run: node scripts/facebook-empire-loop.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_FB_PAGE_ID: ${{ secrets.META_FB_PAGE_ID }}
          NODE_ENV: production
          GITHUB_ACTIONS: "true"

      - name: Commit Status Update
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Crucible Bot"
          git config --global user.email "bot@crucible.ai"
          git add -f scripts/fb-empire-state.json || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: update fb upload cycle [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $i failed, retrying..."; sleep $((i * 15))
          done
          echo "::error::Failed to push state after 3 attempts" && exit 1

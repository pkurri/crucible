name: '🔱 AAK Nation YouTube Empire Fleet'

on:
  # Schedule retired 2026-10-19: replaced by film-empire-fleet.yml (1 film/day).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  produce-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Edge TTS
        run: pip install edge-tts

      - name: Validate YouTube Secrets
        run: |
          if [ -z "${{ secrets.YOUTUBE_CLIENT_SECRET }}" ]; then
            echo "❌ FATAL: YOUTUBE_CLIENT_SECRET secret is missing or empty. Aborting." && exit 1
          fi
          if [ -z "${{ secrets.YOUTUBE_TOKEN_JSON }}" ]; then
            echo "❌ FATAL: YOUTUBE_TOKEN_JSON secret is missing or empty. Re-run youtube-auth-test.mjs locally and update the secret." && exit 1
          fi
          echo "✅ YouTube secrets present."

      - name: Setup YouTube Credentials
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET }}' > client_secret.json
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > youtube-token.json

      - name: Preflight YouTube Token
        run: node scripts/youtube-official-uploader.mjs --verify

      - name: Create Data Structure
        run: mkdir -p data/youtube-empire/AAK-Nation/topics

      - name: Discover Daily Viral Niche
        run: node scripts/niche-strategist.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Architect Viral Scripts
        run: node scripts/viral-script-architect.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Run Empire Production Loop
        run: node scripts/youtube-empire-loop.mjs
        env:
          GITHUB_ACTIONS: "true"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NODE_ENV: production

      - name: Commit Status Update
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Crucible Bot"
          git config --global user.email "bot@crucible.ai"
          rm -rf data/youtube-empire/
          git add -f scripts/yt-empire-state.json data/viral-niches.json data/viral-scripts.json || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: update youtube upload cycle [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $i failed, retrying..."; sleep $((i * 15))
          done
          echo "::error::Failed to push state after 3 attempts" && exit 1

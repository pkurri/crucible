name: 📸 Instagram Carousel Posts

on:
  # Schedule retired 2026-10-19: replaced by film-empire-fleet.yml (1 film/day).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  instagram-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Generate & Upload Instagram Carousel Posts
        run: node scripts/instagram-carousel-producer.mjs
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_ACCOUNT_ID: ${{ secrets.META_IG_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Commit State Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/instagram-carousel-state.json || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: update instagram carousel state [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $i failed, retrying..."; sleep $((i * 15))
          done
          echo "::error::Failed to push state after 3 attempts" && exit 1
        continue-on-error: true
